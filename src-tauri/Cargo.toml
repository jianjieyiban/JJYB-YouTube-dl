[package]
name = "jjyb-youtube-dl"
repository = "https://github.com/jianjieyiban/JJYB-YouTube-dl"
version = "3.4.5"
description = "JJYB 视频下载器，支持多站点视频与音频下载。"
license = "AGPL-3.0-or-later"
authors = ["jianjieyiban"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant, but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "open_video_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

[dependencies]
tauri = { version = "2.11.1", features = ["isolation", "image-png", "tray-icon"] }
tauri-plugin-opener = "2.5.3"
tauri-plugin-global-shortcut = "2.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
uuid = { version = "1.19.0", features = ["v4"] }
futures = "0.3.31"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
arc-swap = "1.8.1"
tokio = { version = "1.52", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "socks"] }
url = "2"
sha2 = "0.11"
semver = "1"
ed25519-dalek = { version = "2", features = ["std"] }
base64 = "0.22.1"
hex = "0.4"
zip = "8.1.0"
tar = "0.4"
bzip2 = "0.6.1"
tauri-plugin-keyring = "0.1.0"
rand = "0.10.1"
tauri-plugin-stronghold = "2.3.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
sentry = { version = "0.48.2", features = [
    "tracing",
] }
regex = "1.12.3"
fs_extra = "1.3.0"
indexmap = { version = "2.13.0", features = ["serde"] }
include_dir = "0.7.4"
sys-locale = "0.3.2"
notify-rust = "4.12"
shlex = "2.0.1"
ferrous-opencc = { version = "0.4.0", default-features = false, features = ["t2s-conversion"] }
tempfile = "3"
same-file = "1"

[dev-dependencies]
tauri = { version = "2.11.1", features = ["test"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.176"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[patch.crates-io]
stronghold-runtime = { path = "vendor/stronghold-runtime" }

[profile.dev]
incremental = true

[profile.dev.package.scrypt]
opt-level = 3

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true
opt-level = "s"
panic = "abort"
strip = false
debug = 1
split-debuginfo = "packed"
